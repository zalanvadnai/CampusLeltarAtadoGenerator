<div class="gen-grid">
  <div class="left-controls no-print">
    <div style="margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" onclick="backToDocSelector()">← Vissza a nyomtatványválasztóhoz</button>
    </div>

    <div class="panel">
      <h3>1. Átadó egység és Keltezés</h3>
      <div class="row-2">
        <div class="form-group">
          <label>Átadó egység kódja</label>
          <div class="unit-combo">
            <input id="aldSndCode" class="form-control" autocomplete="off" placeholder="Válassz vagy írj kódot..." onfocus="AtveteliDolgozoiMod.openUnitDropdown()" oninput="AtveteliDolgozoiMod.handleUnitInput()" />
            <span class="unit-combo-arrow">▼</span>
            <div id="aldSndDropdown" class="unit-dropdown-menu hidden"></div>
          </div>
          <div id="aldSndCodeError" class="field-error-msg hidden">Nincs hozzáférésed ehhez az egységhez!</div>
        </div>
        <div class="form-group">
          <label>Átadó egység neve</label>
          <input id="aldSndName" class="form-control" oninput="AtveteliDolgozoiMod.renderDocument()" />
        </div>
      </div>

      <div class="form-group">
        <label>Átadó neve (opcionális)</label>
        <input id="aldSndSign" class="form-control" placeholder="Egységvezető / átadó neve" oninput="AtveteliDolgozoiMod.renderDocument()" />
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Keltezés helye</label>
          <input id="aldCity" class="form-control" value="Debrecen" oninput="AtveteliDolgozoiMod.renderDocument()" />
        </div>
        <div class="form-group">
          <label>Átvétel dátuma</label>
          <input id="aldDate" type="date" class="form-control" oninput="AtveteliDolgozoiMod.renderDocument()" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0;">
        <label>Megjegyzés</label>
        <textarea id="aldNote" class="form-control" rows="2" oninput="AtveteliDolgozoiMod.renderDocument()"></textarea>
      </div>
    </div>

    <div class="panel">
      <h3>2. Átvevő (Dolgozó) adatai (opcionális)</h3>
      <div class="form-group">
        <label>Átvevő neve</label>
        <input id="aldEmpName" class="form-control" placeholder="Ha üres, vonal jelenik meg" oninput="AtveteliDolgozoiMod.renderDocument()" />
      </div>
      <div class="row-2">
        <div class="form-group" style="margin-bottom:0;">
          <label>Szül. hely, év</label>
          <input id="aldEmpBirth" class="form-control" placeholder="pl. Debrecen, 1990" oninput="AtveteliDolgozoiMod.renderDocument()" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label>Szig. szám</label>
          <input id="aldEmpId" class="form-control" placeholder="pl. 123456AB" oninput="AtveteliDolgozoiMod.renderDocument()" />
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>3. Átvett tárgyi eszközök (<span id="aldItemCountBadge">0</span> tétel)</h3>
      <div style="max-height:360px; overflow:auto; display:flex; flex-direction:column; gap:10px;" id="aldEditItemsList"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn btn-primary btn-sm" onclick="AtveteliDolgozoiMod.addEmptyItem()">+ Új tétel hozzáadása</button>
        <button class="btn btn-outline btn-sm" onclick="AtveteliDolgozoiMod.clearItems()">Tételek törlése</button>
      </div>
    </div>
  </div>

  <div>
    <div class="preview-toolbar no-print">
      <div>
        <strong>Élő A4 nyomtatási kép</strong>
        <span id="aldPageCountInfo" style="color:var(--muted); font-size:13px; margin-left:8px;"></span>
      </div>
      <button class="btn btn-primary" onclick="AtveteliDolgozoiMod.printAndLog()">🖨️ Nyomtatás / Mentés PDF-ként</button>
    </div>
    <div class="pages-wrapper" id="aldPagesContainer"></div>
  </div>
</div>

<script>
  window.AtveteliDolgozoiMod = (function () {
    let activeItems = [];
    let unitValid = true;
    let docClickBound = false;

    function emptyRow() {
      return { name: "", type: "", serial: "", spec: "", nytsz: "" };
    }

    function init() {
      unitValid = true;

      const dateEl = document.getElementById("aldDate");
      if (dateEl && !dateEl.value) {
        const now = new Date();
        dateEl.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      if (!docClickBound) {
        document.addEventListener("click", e => {
          if (!e.target.closest(".unit-combo")) {
            document.getElementById("aldSndDropdown")?.classList.add("hidden");
          }
        });
        docClickBound = true;
      }

      document.getElementById("aldSndCode").value = "";
      handleUnitInput(false);

      if (activeItems.length === 0) activeItems = [emptyRow()];
      renderEditList();
      renderDocument();
    }

    function openUnitDropdown() {
      renderUnitDropdownList(document.getElementById("aldSndCode").value);
      document.getElementById("aldSndDropdown").classList.remove("hidden");
    }

    function renderUnitDropdownList(query = "") {
      const menu = document.getElementById("aldSndDropdown");
      const allowed = getAllowedUnitsForCurrentUser();
      const q = (query || "").trim().toLowerCase();
      const filtered = allowed.filter(u =>
        !q || u.code.toLowerCase().includes(q) || u.name.toLowerCase().includes(q) || (u.leader || "").toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        menu.innerHTML = `<div class="unit-dropdown-empty">Nincs találat az engedélyezett egységek között.</div>`;
        return;
      }

      menu.innerHTML = filtered.map(u => `
        <div class="unit-dropdown-item" onmousedown="AtveteliDolgozoiMod.pickUnitFromDropdown('${escapeHtml(u.code)}')">
          <div><span class="u-code">${escapeHtml(u.code)}</span> – ${escapeHtml(u.name)}</div>
          ${u.leader ? `<div class="u-leader">Vezető: ${escapeHtml(u.leader)}</div>` : ""}
        </div>
      `).join("");
    }

    function pickUnitFromDropdown(code) {
      document.getElementById("aldSndCode").value = code;
      document.getElementById("aldSndDropdown").classList.add("hidden");
      handleUnitInput(false);
    }

    function handleUnitInput(keepMenuOpen = true) {
      const codeEl = document.getElementById("aldSndCode");
      const nameEl = document.getElementById("aldSndName");
      const signEl = document.getElementById("aldSndSign");
      const errEl = document.getElementById("aldSndCodeError");

      const typed = codeEl.value.trim();
      if (keepMenuOpen) {
        renderUnitDropdownList(typed);
        document.getElementById("aldSndDropdown").classList.remove("hidden");
      }

      if (!typed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = "";
        signEl.value = "";
        unitValid = true;
        renderDocument();
        return;
      }

      const allowed = getAllowedUnitsForCurrentUser();
      const matchAllowed = allowed.find(u => u.code.toLowerCase() === typed.toLowerCase());

      if (matchAllowed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = matchAllowed.name;
        signEl.value = matchAllowed.leader || "";
        unitValid = true;
      } else {
        codeEl.classList.add("input-error");
        errEl.classList.remove("hidden");
        nameEl.value = "";
        signEl.value = "";
        unitValid = false;
      }
      renderDocument();
    }

    function renderEditList() {
      const container = document.getElementById("aldEditItemsList");
      document.getElementById("aldItemCountBadge").textContent = activeItems.length;
      container.innerHTML = activeItems.map((it, idx) => `
        <div style="border:1.5px solid #e2e8f0; border-radius:8px; padding:10px; background:#f8fafc;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="font-size:12.5px; color:var(--primary-dark);">${idx + 1}. tétel</strong>
            <button class="btn btn-danger btn-sm" style="padding:2px 7px;" onclick="AtveteliDolgozoiMod.removeItem(${idx})">×</button>
          </div>
          <input class="form-control" style="padding:6px 8px; font-size:12.5px; margin-bottom:6px;" placeholder="Megnevezés" value="${escapeHtml(it.name)}" oninput="AtveteliDolgozoiMod.updateItem(${idx},'name',this.value)" />
          <div class="row-2" style="margin-bottom:6px;">
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Típus" value="${escapeHtml(it.type)}" oninput="AtveteliDolgozoiMod.updateItem(${idx},'type',this.value)" />
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Gyári szám" value="${escapeHtml(it.serial)}" oninput="AtveteliDolgozoiMod.updateItem(${idx},'serial',this.value)" />
          </div>
          <div class="row-2">
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Specifikáció (szín, méret)" value="${escapeHtml(it.spec)}" oninput="AtveteliDolgozoiMod.updateItem(${idx},'spec',this.value)" />
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Nyilv.tart. szám" value="${escapeHtml(it.nytsz)}" oninput="AtveteliDolgozoiMod.updateItem(${idx},'nytsz',this.value)" />
          </div>
        </div>
      `).join("");
    }

    function updateItem(idx, field, val) { activeItems[idx][field] = val; renderDocument(); }
    function addEmptyItem() { activeItems.push(emptyRow()); renderEditList(); renderDocument(); }
    function removeItem(idx) { activeItems.splice(idx, 1); if (activeItems.length === 0) activeItems.push(emptyRow()); renderEditList(); renderDocument(); }
    function clearItems() { activeItems = [emptyRow()]; renderEditList(); renderDocument(); }

    function formatHuYearMonthDay(isoDate) {
      if (!isoDate) return "________ év __________ hó ____ nap";
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      return `${parts[0]}. év ${parts[1]}. hó ${parts[2]}. nap`;
    }

    function renderDocument() {
      const container = document.getElementById("aldPagesContainer");
      if (!container) return;
      container.innerHTML = "";

      const sndCode = unitValid ? document.getElementById("aldSndCode").value.trim() : "";
      const sndName = document.getElementById("aldSndName").value.trim();
      const sndSign = document.getElementById("aldSndSign").value.trim();
      const dateStr = formatHuYearMonthDay(document.getElementById("aldDate").value);
      const city = document.getElementById("aldCity").value.trim() || "Debrecen";
      const note = document.getElementById("aldNote").value;

      const empName = document.getElementById("aldEmpName").value.trim();
      const empBirth = document.getElementById("aldEmpBirth").value.trim();
      const empId = document.getElementById("aldEmpId").value.trim();

      const comp = selectedCompany || COMPANIES.DCNK;
      const displayItems = activeItems;

      const pages = [];
      let idx = 0, pageNum = 1;
      while (idx < displayItems.length) {
        const isFirst = (pageNum === 1);
        const remaining = displayItems.length - idx;
        const maxWithClosing = isFirst ? 12 : 20;
        const maxWithoutClosing = isFirst ? 26 : 34;

        if (remaining <= maxWithClosing) {
          pages.push({ pageNum, items: displayItems.slice(idx), isFirst, isLast: true });
          idx = displayItems.length;
        } else {
          const take = Math.min(remaining, maxWithoutClosing);
          pages.push({ pageNum, items: displayItems.slice(idx, idx + take), isFirst, isLast: false });
          idx += take;
          pageNum++;
          if (idx === displayItems.length) pages.push({ pageNum, items: [], isFirst: false, isLast: true });
        }
      }

      const filledCount = activeItems.filter(i => i.name.trim() || i.type.trim() || i.nytsz.trim()).length;
      document.getElementById("aldPageCountInfo").textContent = `(${pages.length} oldal • ${filledCount} kitöltött tétel)`;

      const empNameField = empName
        ? `<span style="display:inline-block; min-width:44mm; border-bottom:1px solid #000; padding:0 4px; font-weight:600; text-align:center;">${escapeHtml(empName)}</span>`
        : `<span style="display:inline-block; width:44mm; border-bottom:1px solid #000;">&nbsp;</span>`;

      const empBirthField = empBirth
        ? `<span style="display:inline-block; min-width:36mm; border-bottom:1px solid #000; padding:0 4px; font-weight:600; text-align:center;">${escapeHtml(empBirth)}</span>`
        : `<span style="display:inline-block; width:36mm; border-bottom:1px solid #000;">&nbsp;</span>`;

      const empIdField = empId
        ? `<span style="display:inline-block; min-width:26mm; border-bottom:1px solid #000; padding:0 4px; font-weight:600; text-align:center;">${escapeHtml(empId)}</span>`
        : `<span style="display:inline-block; width:26mm; border-bottom:1px solid #000;">&nbsp;</span>`;

      pages.forEach(p => {
        const pageEl = document.createElement("div");
        pageEl.className = "a4-page";

        let html = `
          <div class="doc-top-bar" style="margin-bottom:5mm;">
            <img src="${comp.logo}" alt="${comp.code}" onerror="this.src='${comp.fallbackLogo}'" />
            <div class="doc-top-title" style="font-size:8.5pt;">TÁRGYI ESZKÖZÖK ÁTVÉTELI LAPJA (DOLGOZÓI)</div>
          </div>
        `;

        if (p.isFirst) {
          html += `
            <div style="display:grid; grid-template-columns: 1.45fr 0.75fr; gap:6mm; align-items:start; margin-bottom:3mm;">
              <div>
                <div class="doc-main-title" style="font-size:15.5pt; text-align:left; margin:0 0 3mm;">
                  TÁRGYI ESZKÖZÖK ÁTVÉTELI LAPJA
                </div>
                <div style="font-family:'Times New Roman', Times, serif; font-size:9.5pt; line-height:1.4; text-align:justify;">
                  Az Átvevő az átvételi lap aláírásával felelősséget vállal az alábbi eszközök használata közben előforduló sérülésekért, meghibásodásért, vagy az eszközök esetleges eltűnéséért.
                </div>
              </div>
              <table class="party-table" style="font-size:8.5pt;">
                <tr><th colspan="2">ÁTADÓ</th></tr>
                <tr><td style="width:45%;">Egység kód</td><td>${escapeHtml(sndCode)}</td></tr>
                <tr><td>Egység neve</td><td>${escapeHtml(sndName)}</td></tr>
              </table>
            </div>
            <div style="font-family:'Times New Roman', Times, serif; font-size:9.5pt; line-height:1.4; text-align:justify; margin-bottom:5mm;">
              A nem rendeltetésszerű használatból adódó kár, vagy meghibásodás költsége - a garanciális javítások kivételével -, továbbá az eszköz eltűnéséből eredő kár az Átvevőt terheli.
            </div>
          `;
        }

        if (p.items.length > 0 || p.isFirst) {
          html += `
            <table class="items-table" style="font-size:8.5pt; margin-bottom:5mm;">
              <thead>
                <tr>
                  <th style="width:31%;">MEGNEVEZÉS</th>
                  <th style="width:14%;">TÍPUS</th>
                  <th style="width:15%;">GYÁRI SZÁM</th>
                  <th style="width:23%;">SPECIFIKÁCIÓ (PL. SZÍN, MÉRET)</th>
                  <th style="width:17%;">NYILV.TART. SZÁM</th>
                </tr>
              </thead>
              <tbody>
                ${p.items.map(it => `
                  <tr style="height:6.8mm;">
                    <td>${escapeHtml(it.name)}</td>
                    <td>${escapeHtml(it.type)}</td>
                    <td>${escapeHtml(it.serial)}</td>
                    <td>${escapeHtml(it.spec)}</td>
                    <td class="c-center">${escapeHtml(it.nytsz)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `;
        }

        if (p.isLast) {
          html += `
            <table class="note-box" style="margin-bottom:6mm;">
              <tr><th>MEGJEGYZÉS</th></tr>
              <tr><td style="height:26mm;">${escapeHtml(note)}</td></tr>
            </table>

            <div style="font-family:Arial, sans-serif; font-weight:700; font-size:10pt; margin-bottom:3mm;">
              ÁTVÉTEL ELISMERÉSE
            </div>

            <div style="font-family:'Times New Roman', Times, serif; font-size:10pt; line-height:1.65; text-align:justify; margin-bottom:7mm;">
              Alulírott ${empNameField} (szül. hely, év: ${empBirthField}; szig. szám: ${empIdField}), mint Átvevő, jelen átvételi lap aláírásával kijelentem és igazolom, hogy a fent részletezett tárgyi eszköz(öke)t a mai napon visszaszolgáltatási kötelezettséggel átvettem.
            </div>

            <div style="font-family:'Times New Roman', Times, serif; font-size:10.5pt; margin-bottom:14mm;">
              ${escapeHtml(city)}, ${escapeHtml(dateStr)}
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18mm; text-align:center; font-family:'Times New Roman', Times, serif;">
              <div>
                <div style="min-height:5mm; font-size:9.5pt;">${escapeHtml(sndSign)}</div>
                <div style="border-top:1px solid #000; padding-top:3px; font-size:9.5pt;">Átadó neve / aláírása</div>
              </div>
              <div>
                <div style="min-height:5mm;"></div>
                <div style="border-top:1px solid #000; padding-top:3px; font-size:9.5pt;">Átvevő aláírása</div>
              </div>
            </div>
          `;
        }

        html += `
          <div class="doc-footer">
            ${p.pageNum}. oldal — ${escapeHtml(comp.fullName)} — Tárgyi eszközök átvételi lapja (dolgozói változat)
          </div>
        `;

        pageEl.innerHTML = html;
        container.appendChild(pageEl);
      });
    }

    async function printAndLog() {
      if (!unitValid) {
        showToast("Hibás vagy nem engedélyezett egységkód szerepel a nyomtatványon!", "error");
        return;
      }
      window.print();
      if (!currentUser) return;
      const compTag = selectedCompany ? `[${selectedCompany.code}] ` : "";
      const snd = `${document.getElementById("aldSndCode").value} ${document.getElementById("aldSndName").value}`.trim();
      const emp = document.getElementById("aldEmpName").value.trim() || "—";
      const filledCount = activeItems.filter(i => i.name.trim() || i.type.trim() || i.nytsz.trim()).length;
      const details = `${compTag}Átadó: ${snd || "—"} → Dolgozó: ${emp} | Dátum: ${document.getElementById("aldDate").value} | ${filledCount} tétel`;

      try {
        await apiCall({
          action: "logDocument",
          username: currentUser.username,
          userName: currentUser.fullName || currentUser.name || currentUser.username,
          docType: "Tárgyi eszközök átvételi lapja (dolgozói)",
          details
        });
      } catch (e) {}
    }

    return {
      init, openUnitDropdown, pickUnitFromDropdown, handleUnitInput,
      updateItem, addEmptyItem, removeItem, clearItems, renderDocument, printAndLog
    };
  })();

  window.TemplateModules["atveteli_lap_dolgozoi"] = window.AtveteliDolgozoiMod;
</script>
