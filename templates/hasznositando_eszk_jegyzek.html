<div class="gen-grid">
  <div class="left-controls no-print">
    <div style="margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" onclick="backToDocSelector()">← Vissza a nyomtatványválasztóhoz</button>
    </div>

    <div class="panel">
      <h3>1. Átadó részleg és Dátum</h3>
      <div class="row-2">
        <div class="form-group">
          <label>Részlegszám (Egységkód)</label>
          <div class="unit-combo">
            <input id="heSndCode" class="form-control" autocomplete="off" placeholder="Válassz vagy írj kódot..." onfocus="HasznositandoMod.openUnitDropdown()" oninput="HasznositandoMod.handleUnitInput()" />
            <span class="unit-combo-arrow">▼</span>
            <div id="heSndDropdown" class="unit-dropdown-menu hidden"></div>
          </div>
          <div id="heSndCodeError" class="field-error-msg hidden">Nincs hozzáférésed ehhez az egységhez!</div>
        </div>
        <div class="form-group">
          <label>Részleg neve</label>
          <input id="heSndName" class="form-control" oninput="HasznositandoMod.renderDocument()" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Átadás dátuma</label>
          <input id="heDate" type="date" class="form-control" oninput="HasznositandoMod.renderDocument()" />
        </div>
        <div class="form-group">
          <label>Keltezés helye</label>
          <input id="heCity" class="form-control" value="Debrecen" oninput="HasznositandoMod.renderDocument()" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group" style="margin-bottom:0;">
          <label>Bizottság részéről (opcionális)</label>
          <input id="heBiz1" class="form-control" style="margin-bottom:5px;" placeholder="1. bizottsági tag neve" oninput="HasznositandoMod.renderDocument()" />
          <input id="heBiz2" class="form-control" style="margin-bottom:5px;" placeholder="2. bizottsági tag neve" oninput="HasznositandoMod.renderDocument()" />
          <input id="heBiz3" class="form-control" placeholder="3. bizottsági tag neve" oninput="HasznositandoMod.renderDocument()" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label>Részleg részéről (opcionális)</label>
          <input id="heResz1" class="form-control" style="margin-bottom:5px;" placeholder="1. részleg aláíró neve" oninput="HasznositandoMod.renderDocument()" />
          <input id="heResz2" class="form-control" style="margin-bottom:5px;" placeholder="2. részleg aláíró neve" oninput="HasznositandoMod.renderDocument()" />
          <input id="heResz3" class="form-control" placeholder="3. részleg aláíró neve" oninput="HasznositandoMod.renderDocument()" />
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>2. Eszközök / Tételek (<span id="heItemCountBadge">0</span> tétel)</h3>
      <div style="max-height:360px; overflow:auto; display:flex; flex-direction:column; gap:10px;" id="heEditItemsList"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn btn-primary btn-sm" onclick="HasznositandoMod.addEmptyItem()">+ Új tétel hozzáadása</button>
        <button class="btn btn-outline btn-sm" onclick="HasznositandoMod.clearItems()">Tételek törlése</button>
      </div>
    </div>
  </div>

  <div>
    <div class="preview-toolbar no-print">
      <div>
        <strong>Élő A4 nyomtatási kép</strong>
        <span id="hePageCountInfo" style="color:var(--muted); font-size:13px; margin-left:8px;"></span>
      </div>
      <button class="btn btn-primary" onclick="HasznositandoMod.printAndLog()">🖨️ Nyomtatás / Mentés PDF-ként</button>
    </div>
    <div class="pages-wrapper" id="hePagesContainer"></div>
  </div>
</div>

<script>
  window.HasznositandoMod = (function () {
    const UTIL_CODES = [
      { code: "1", text: "Tovább értékesítés" },
      { code: "2", text: "Haszonanyagként értékesítés" },
      { code: "3", text: "Hulladékként értékesítés" },
      { code: "4", text: "Megsemmisítés" }
    ];

    let activeItems = [];
    let unitValid = true;
    let docClickBound = false;

    function emptyRow() {
      return { inv: "", nytsz: "", name: "", proposal: "", value: "" };
    }

    function init() {
      unitValid = true;

      const dateEl = document.getElementById("heDate");
      if (dateEl && !dateEl.value) {
        const now = new Date();
        dateEl.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      if (!docClickBound) {
        document.addEventListener("click", e => {
          if (!e.target.closest(".unit-combo")) {
            document.getElementById("heSndDropdown")?.classList.add("hidden");
          }
        });
        docClickBound = true;
      }

      document.getElementById("heSndCode").value = "";
      handleUnitInput(false);

      if (activeItems.length === 0) activeItems = [emptyRow()];
      renderEditList();
      renderDocument();
    }

    function openUnitDropdown() {
      renderUnitDropdownList(document.getElementById("heSndCode").value);
      document.getElementById("heSndDropdown").classList.remove("hidden");
    }

    function renderUnitDropdownList(query = "") {
      const menu = document.getElementById("heSndDropdown");
      const allowed = getAllowedUnitsForCurrentUser();
      const q = (query || "").trim().toLowerCase();
      const filtered = allowed.filter(u =>
        !q || u.code.toLowerCase().includes(q) || u.name.toLowerCase().includes(q) || (u.leader || "").toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        menu.innerHTML = `<div class="unit-dropdown-empty">Nincs találat az engedélyezett egységek között.</div>`;
        return;
      }

      menu.innerHTML = filtered.map(u => `
        <div class="unit-dropdown-item" onmousedown="HasznositandoMod.pickUnitFromDropdown('${escapeHtml(u.code)}')">
          <div><span class="u-code">${escapeHtml(u.code)}</span> – ${escapeHtml(u.name)}</div>
          ${u.leader ? `<div class="u-leader">Vezető: ${escapeHtml(u.leader)}</div>` : ""}
        </div>
      `).join("");
    }

    function pickUnitFromDropdown(code) {
      document.getElementById("heSndCode").value = code;
      document.getElementById("heSndDropdown").classList.add("hidden");
      handleUnitInput(false);
    }

    function handleUnitInput(keepMenuOpen = true) {
      const codeEl = document.getElementById("heSndCode");
      const nameEl = document.getElementById("heSndName");
      const resz1El = document.getElementById("heResz1");
      const errEl = document.getElementById("heSndCodeError");

      const typed = codeEl.value.trim();
      if (keepMenuOpen) {
        renderUnitDropdownList(typed);
        document.getElementById("heSndDropdown").classList.remove("hidden");
      }

      if (!typed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = "";
        resz1El.value = "";
        unitValid = true;
        renderDocument();
        return;
      }

      const allowed = getAllowedUnitsForCurrentUser();
      const matchAllowed = allowed.find(u => u.code.toLowerCase() === typed.toLowerCase());

      if (matchAllowed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = matchAllowed.name;
        resz1El.value = matchAllowed.leader || "";
        unitValid = true;
      } else {
        codeEl.classList.add("input-error");
        errEl.classList.remove("hidden");
        nameEl.value = "";
        resz1El.value = "";
        unitValid = false;
      }
      renderDocument();
    }

    function renderEditList() {
      const container = document.getElementById("heEditItemsList");
      document.getElementById("heItemCountBadge").textContent = activeItems.length;
      container.innerHTML = activeItems.map((it, idx) => `
        <div style="border:1.5px solid #e2e8f0; border-radius:8px; padding:10px; background:#f8fafc;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="font-size:12.5px; color:var(--primary-dark);">${idx + 1}. tétel</strong>
            <button class="btn btn-danger btn-sm" style="padding:2px 7px;" onclick="HasznositandoMod.removeItem(${idx})">×</button>
          </div>
          <div class="row-2" style="margin-bottom:6px;">
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Leltárszám" value="${escapeHtml(it.inv)}" oninput="HasznositandoMod.updateItem(${idx},'inv',this.value)" />
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="NYTSZ szám" value="${escapeHtml(it.nytsz)}" oninput="HasznositandoMod.updateItem(${idx},'nytsz',this.value)" />
          </div>
          <input class="form-control" style="padding:6px 8px; font-size:12.5px; margin-bottom:6px;" placeholder="Megnevezés" value="${escapeHtml(it.name)}" oninput="HasznositandoMod.updateItem(${idx},'name',this.value)" />
          <div class="row-2">
            <select class="form-control" style="padding:6px 8px; font-size:12.5px;" onchange="HasznositandoMod.updateItem(${idx},'proposal',this.value)">
              <option value="" ${it.proposal === "" ? "selected" : ""}>Hasznosítási javaslat...</option>
              ${UTIL_CODES.map(r => `<option value="${r.code}" ${it.proposal === r.code ? "selected" : ""}>${r.code} – ${r.text}</option>`).join("")}
            </select>
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Érték (Ft)" value="${escapeHtml(it.value)}" oninput="HasznositandoMod.updateItem(${idx},'value',this.value)" />
          </div>
        </div>
      `).join("");
    }

    function updateItem(idx, field, val) { activeItems[idx][field] = val; renderDocument(); }
    function addEmptyItem() { activeItems.push(emptyRow()); renderEditList(); renderDocument(); }
    function removeItem(idx) { activeItems.splice(idx, 1); if (activeItems.length === 0) activeItems.push(emptyRow()); renderEditList(); renderDocument(); }
    function clearItems() { activeItems = [emptyRow()]; renderEditList(); renderDocument(); }

    function formatHuYearMonthDay(isoDate) {
      if (!isoDate) return "20____ év ____________ hó ____ nap";
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      return `${parts[0]}. év ${parts[1]}. hó ${parts[2]}. nap`;
    }

    function renderDocument() {
      const container = document.getElementById("hePagesContainer");
      if (!container) return;
      container.innerHTML = "";

      const sndCode = unitValid ? document.getElementById("heSndCode").value.trim() : "";
      const sndName = document.getElementById("heSndName").value.trim();
      const dateStr = formatHuYearMonthDay(document.getElementById("heDate").value);
      const city = document.getElementById("heCity").value.trim() || "Debrecen";
      const biz1 = document.getElementById("heBiz1").value.trim();
      const biz2 = document.getElementById("heBiz2").value.trim();
      const biz3 = document.getElementById("heBiz3").value.trim();
      const resz1 = document.getElementById("heResz1").value.trim();
      const resz2 = document.getElementById("heResz2").value.trim();
      const resz3 = document.getElementById("heResz3").value.trim();

      const comp = selectedCompany || COMPANIES.DCNK;

      // Minimum 18 sor az 1. oldalon (a sablon arányainak megfelelően)
      const displayItems = activeItems.length >= 18
        ? activeItems
        : [...activeItems, ...Array.from({ length: 18 - activeItems.length }, () => emptyRow())];

      const pages = [];
      let idx = 0, pageNum = 1;
      while (idx < displayItems.length) {
        const isFirst = (pageNum === 1);
        const remaining = displayItems.length - idx;
        const maxWithClosing = isFirst ? 18 : 22;
        const maxWithoutClosing = isFirst ? 28 : 34;

        if (remaining <= maxWithClosing) {
          pages.push({ pageNum, items: displayItems.slice(idx), isFirst, isLast: true });
          idx = displayItems.length;
        } else {
          const take = Math.min(remaining, maxWithoutClosing);
          pages.push({ pageNum, items: displayItems.slice(idx, idx + take), isFirst, isLast: false });
          idx += take;
          pageNum++;
          if (idx === displayItems.length) pages.push({ pageNum, items: [], isFirst: false, isLast: true });
        }
      }

      const filledCount = activeItems.filter(i => i.name.trim() || i.nytsz.trim() || i.inv.trim()).length;
      document.getElementById("hePageCountInfo").textContent = `(${pages.length} oldal • ${filledCount} kitöltött tétel)`;

      pages.forEach(p => {
        const pageEl = document.createElement("div");
        pageEl.className = "a4-page";

        let html = `
          <div class="doc-top-bar" style="margin-bottom:4mm;">
            <img src="${comp.logo}" alt="${comp.code}" onerror="this.src='${comp.fallbackLogo}'" />
            <div class="doc-top-title" style="font-size:8.5pt;">HASZNOSÍTANDÓ ESZKÖZÖK JEGYZÉKE</div>
          </div>
        `;

        if (p.isFirst) {
          html += `
            <div class="doc-main-title" style="font-size:15.5pt; margin:0 0 5mm;">
              HASZNOSÍTANDÓ TÁRGYI ESZKÖZÖK JEGYZÉKE
            </div>
            <div style="display:grid; grid-template-columns: 1fr 0.35fr 1fr; gap:4mm; margin-bottom:5mm;">
              <table class="party-table">
                <tr><th colspan="2">ÁTADÓ</th></tr>
                <tr><td>Részlegszám</td><td>${escapeHtml(sndCode)}</td></tr>
                <tr><td>Részleg neve</td><td>${escapeHtml(sndName)}</td></tr>
              </table>
              <div></div>
              <table class="party-table">
                <tr><th>ÁTADÁS DÁTUMA</th></tr>
                <tr><td style="text-align:center; height:14mm; vertical-align:middle; background:#fff; font-weight:600;">${escapeHtml(dateStr)}</td></tr>
              </table>
            </div>
          `;
        }

        if (p.items.length > 0 || p.isFirst) {
          html += `
            <table class="items-table" style="font-size:8.5pt; margin-bottom:4mm;">
              <thead>
                <tr>
                  <th style="width:13%;">LELTÁRSZÁM</th>
                  <th style="width:13%;">NYTSZ SZÁM</th>
                  <th style="width:38%;">MEGNEVEZÉS</th>
                  <th style="width:22%;">HASZNOSÍTÁSI JAVASLAT</th>
                  <th style="width:14%;">ÉRTÉK (FT)</th>
                </tr>
              </thead>
              <tbody>
                ${p.items.map(it => {
                  const uObj = UTIL_CODES.find(r => r.code === it.proposal);
                  const propDisplay = uObj ? `${uObj.code} – ${uObj.text}` : escapeHtml(it.proposal);
                  return `
                    <tr style="height:5.8mm;">
                      <td class="c-center">${escapeHtml(it.inv)}</td>
                      <td class="c-center">${escapeHtml(it.nytsz)}</td>
                      <td>${escapeHtml(it.name)}</td>
                      <td style="font-size:7.5pt;">${propDisplay}</td>
                      <td class="c-right">${escapeHtml(it.value)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          `;
        }

        if (p.isLast) {
          html += `
            <div style="display:grid; grid-template-columns: 1.25fr 0.85fr; gap:6mm; align-items:start; margin-bottom:2mm;">
              <div style="display:flex; flex-direction:column; justify-content:space-between; height:100%;">
                <div style="font-family:'Times New Roman', Times, serif; font-size:10.5pt; padding-top:2mm;">
                  ${escapeHtml(city)}, ${escapeHtml(dateStr)}
                </div>
                <div style="font-family:Arial, sans-serif; font-weight:700; font-size:10pt; margin-top:10mm;">
                  Aláírások:
                </div>
              </div>

              <table style="width:100%; border-collapse:collapse; font-family:Arial, sans-serif; font-size:7.5pt;">
                <thead>
                  <tr>
                    <th style="background:var(--primary-dark); color:#fff; border:1px solid #000; padding:3px 5px; text-align:left;">HASZNOSÍTÁSI MÓDOK</th>
                    <th style="background:var(--primary-dark); color:#fff; border:1px solid #000; padding:3px 5px; text-align:center; width:36px;">KÓD</th>
                  </tr>
                </thead>
                <tbody>
                  ${UTIL_CODES.map(u => `
                    <tr>
                      <td style="border:1px solid #000; padding:2px 5px;">${u.text}</td>
                      <td style="border:1px solid #000; padding:2px 5px; text-align:center; font-weight:700;">${u.code}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18mm; margin-top:3mm; font-family:Arial, sans-serif; text-align:center;">
              <div>
                <div style="font-weight:700; font-size:9.5pt; margin-bottom:6mm;">Bizottság részéről</div>
                <div style="min-height:4mm; font-size:8.5pt;">${escapeHtml(biz1)}</div>
                <div class="sign-line" style="font-size:8pt; margin-bottom:7mm;">név / aláírás</div>
                <div style="min-height:4mm; font-size:8.5pt;">${escapeHtml(biz2)}</div>
                <div class="sign-line" style="font-size:8pt; margin-bottom:7mm;">név / aláírás</div>
                <div style="min-height:4mm; font-size:8.5pt;">${escapeHtml(biz3)}</div>
                <div class="sign-line" style="font-size:8pt;">név / aláírás</div>
              </div>
              <div>
                <div style="font-weight:700; font-size:9.5pt; margin-bottom:6mm;">Részleg részéről</div>
                <div style="min-height:4mm; font-size:8.5pt;">${escapeHtml(resz1)}</div>
                <div class="sign-line" style="font-size:8pt; margin-bottom:7mm;">név / aláírás</div>
                <div style="min-height:4mm; font-size:8.5pt;">${escapeHtml(resz2)}</div>
                <div class="sign-line" style="font-size:8pt; margin-bottom:7mm;">név / aláírás</div>
                <div style="min-height:4mm; font-size:8.5pt;">${escapeHtml(resz3)}</div>
                <div class="sign-line" style="font-size:8pt;">név / aláírás</div>
              </div>
            </div>
          `;
        }

        html += `
          <div class="doc-footer">
            ${p.pageNum}. oldal — ${escapeHtml(comp.fullName)} — Hasznosítandó tárgyi eszközök jegyzéke
          </div>
        `;

        pageEl.innerHTML = html;
        container.appendChild(pageEl);
      });
    }

    async function printAndLog() {
      if (!unitValid) {
        showToast("Hibás vagy nem engedélyezett egységkód szerepel a nyomtatványon!", "error");
        return;
      }
      window.print();
      if (!currentUser) return;
      const compTag = selectedCompany ? `[${selectedCompany.code}] ` : "";
      const snd = `${document.getElementById("heSndCode").value} ${document.getElementById("heSndName").value}`;
      const filledCount = activeItems.filter(i => i.name.trim() || i.nytsz.trim() || i.inv.trim()).length;
      const details = `${compTag}Részleg: ${snd} | Dátum: ${document.getElementById("heDate").value} | ${filledCount} tétel`;

      try {
        await apiCall({
          action: "logDocument",
          username: currentUser.username,
          userName: currentUser.fullName || currentUser.name || currentUser.username,
          docType: "Hasznosítandó tárgyi eszközök jegyzéke",
          details
        });
      } catch (e) {}
    }

    return {
      init, openUnitDropdown, pickUnitFromDropdown, handleUnitInput,
      updateItem, addEmptyItem, removeItem, clearItems, renderDocument, printAndLog
    };
  })();

  window.TemplateModules["hasznositando_eszk_jegyzek"] = window.HasznositandoMod;
</script>
