<div class="gen-grid">
  <div class="left-controls no-print">
    <div style="margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" onclick="backToDocSelector()">← Vissza a nyomtatványválasztóhoz</button>
    </div>

    <div class="panel">
      <h3>1. Átadó, Átvevő és Dátum</h3>
      <div class="row-2">
        <div class="form-group">
          <label>Átadó egység kódja</label>
          <div class="unit-combo">
            <input id="ekSndCode" class="form-control" autocomplete="off" placeholder="Válassz vagy írj kódot..." onfocus="EgysegekMod.openUnitDropdown('snd')" oninput="EgysegekMod.handleUnitInput('snd')" />
            <span class="unit-combo-arrow">▼</span>
            <div id="ekSndDropdown" class="unit-dropdown-menu hidden"></div>
          </div>
          <div id="ekSndCodeError" class="field-error-msg hidden">Nincs hozzáférésed ehhez az egységhez!</div>
        </div>
        <div class="form-group">
          <label>Átadó egység neve</label>
          <input id="ekSndName" class="form-control" oninput="EgysegekMod.renderDocument()" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Átvevő egység kódja</label>
          <div class="unit-combo">
            <input id="ekRecCode" class="form-control" autocomplete="off" placeholder="Válassz vagy írj kódot..." onfocus="EgysegekMod.openUnitDropdown('rec')" oninput="EgysegekMod.handleUnitInput('rec')" />
            <span class="unit-combo-arrow">▼</span>
            <div id="ekRecDropdown" class="unit-dropdown-menu hidden"></div>
          </div>
          <div id="ekRecCodeError" class="field-error-msg hidden">Nincs hozzáférésed ehhez az egységhez!</div>
        </div>
        <div class="form-group">
          <label>Átvevő egység neve</label>
          <input id="ekRecName" class="form-control" oninput="EgysegekMod.renderDocument()" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Átadó neve (aláíró)</label>
          <input id="ekSndSign" class="form-control" oninput="EgysegekMod.renderDocument()" />
        </div>
        <div class="form-group">
          <label>Átvevő neve (aláíró)</label>
          <input id="ekRecSign" class="form-control" oninput="EgysegekMod.renderDocument()" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Átadás dátuma</label>
          <input id="ekDate" type="date" class="form-control" oninput="EgysegekMod.renderDocument()" />
        </div>
        <div class="form-group">
          <label>Keltezés helye</label>
          <input id="ekCity" class="form-control" value="Debrecen" oninput="EgysegekMod.renderDocument()" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0;">
        <label>Megjegyzés</label>
        <textarea id="ekNote" class="form-control" rows="2" oninput="EgysegekMod.renderDocument()"></textarea>
      </div>
    </div>

    <div class="panel">
      <h3>2. Eszközök / Tételek (<span id="ekItemCountBadge">0</span> tétel)</h3>
      <div style="max-height:300px; overflow:auto;">
        <table class="mini-table">
          <thead>
            <tr>
              <th style="width:28%;">Megnevezés</th>
              <th style="width:20%;">Típus</th>
              <th style="width:20%;">Gyári szám</th>
              <th style="width:24%;">Specifikáció</th>
              <th style="width:8%;"></th>
            </tr>
          </thead>
          <tbody id="ekEditItemsBody"></tbody>
        </table>
      </div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn btn-primary btn-sm" onclick="EgysegekMod.addEmptyItem()">+ Új tétel</button>
        <button class="btn btn-outline btn-sm" onclick="EgysegekMod.clearItems()">Tételek törlése</button>
      </div>
    </div>
  </div>

  <div>
    <div class="preview-toolbar no-print">
      <div>
        <strong>Élő A4 nyomtatási kép</strong>
        <span id="ekPageCountInfo" style="color:var(--muted); font-size:13px; margin-left:8px;"></span>
      </div>
      <button class="btn btn-primary" onclick="EgysegekMod.printAndLog()">🖨️ Nyomtatás / Mentés PDF-ként</button>
    </div>
    <div class="pages-wrapper" id="ekPagesContainer"></div>
  </div>
</div>

<script>
  window.EgysegekMod = (function () {
    let activeItems = [];
    let unitValidationState = { rec: true, snd: true };
    let docClickBound = false;

    function init() {
      unitValidationState = { rec: true, snd: true };

      const dateEl = document.getElementById("ekDate");
      if (dateEl && !dateEl.value) {
        const now = new Date();
        dateEl.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      if (!docClickBound) {
        document.addEventListener("click", e => {
          if (!e.target.closest(".unit-combo")) {
            document.getElementById("ekRecDropdown")?.classList.add("hidden");
            document.getElementById("ekSndDropdown")?.classList.add("hidden");
          }
        });
        docClickBound = true;
      }

      document.getElementById("ekRecCode").value = "";
      document.getElementById("ekSndCode").value = "";
      handleUnitInput("rec", false);
      handleUnitInput("snd", false);

      if (activeItems.length === 0) {
        activeItems = [{ name: "", type: "", serial: "", spec: "" }];
      }
      renderEditTable();
      renderDocument();
    }

    function openUnitDropdown(side) {
      document.getElementById(side === "rec" ? "ekSndDropdown" : "ekRecDropdown").classList.add("hidden");
      const val = document.getElementById(side === "rec" ? "ekRecCode" : "ekSndCode").value;
      renderUnitDropdownList(side, val);
      document.getElementById(side === "rec" ? "ekRecDropdown" : "ekSndDropdown").classList.remove("hidden");
    }

    function renderUnitDropdownList(side, query = "") {
      const menu = document.getElementById(side === "rec" ? "ekRecDropdown" : "ekSndDropdown");
      const allowed = getAllowedUnitsForCurrentUser();
      const q = (query || "").trim().toLowerCase();
      const filtered = allowed.filter(u =>
        !q || u.code.toLowerCase().includes(q) || u.name.toLowerCase().includes(q) || (u.leader || "").toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        menu.innerHTML = `<div class="unit-dropdown-empty">Nincs találat az engedélyezett egységek között.</div>`;
        return;
      }

      menu.innerHTML = filtered.map(u => `
        <div class="unit-dropdown-item" onmousedown="EgysegekMod.pickUnitFromDropdown('${side}', '${escapeHtml(u.code)}')">
          <div><span class="u-code">${escapeHtml(u.code)}</span> – ${escapeHtml(u.name)}</div>
          ${u.leader ? `<div class="u-leader">Vezető: ${escapeHtml(u.leader)}</div>` : ""}
        </div>
      `).join("");
    }

    function pickUnitFromDropdown(side, code) {
      document.getElementById(side === "rec" ? "ekRecCode" : "ekSndCode").value = code;
      document.getElementById(side === "rec" ? "ekRecDropdown" : "ekSndDropdown").classList.add("hidden");
      handleUnitInput(side, false);
    }

    function handleUnitInput(side, keepMenuOpen = true) {
      const codeEl = document.getElementById(side === "rec" ? "ekRecCode" : "ekSndCode");
      const nameEl = document.getElementById(side === "rec" ? "ekRecName" : "ekSndName");
      const signEl = document.getElementById(side === "rec" ? "ekRecSign" : "ekSndSign");
      const errEl = document.getElementById(side === "rec" ? "ekRecCodeError" : "ekSndCodeError");

      const typed = codeEl.value.trim();
      if (keepMenuOpen) {
        renderUnitDropdownList(side, typed);
        document.getElementById(side === "rec" ? "ekRecDropdown" : "ekSndDropdown").classList.remove("hidden");
      }

      if (!typed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = "";
        signEl.value = "";
        unitValidationState[side] = true;
        renderDocument();
        return;
      }

      const allowed = getAllowedUnitsForCurrentUser();
      const matchAllowed = allowed.find(u => u.code.toLowerCase() === typed.toLowerCase());

      if (matchAllowed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = matchAllowed.name;
        signEl.value = matchAllowed.leader || "";
        unitValidationState[side] = true;
      } else {
        codeEl.classList.add("input-error");
        errEl.classList.remove("hidden");
        nameEl.value = "";
        signEl.value = "";
        unitValidationState[side] = false;
      }
      renderDocument();
    }

    function renderEditTable() {
      const tbody = document.getElementById("ekEditItemsBody");
      document.getElementById("ekItemCountBadge").textContent = activeItems.length;
      tbody.innerHTML = "";
      activeItems.forEach((item, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input value="${escapeHtml(item.name)}" placeholder="Megnevezés" oninput="EgysegekMod.updateItem(${idx},'name',this.value)" /></td>
          <td><input value="${escapeHtml(item.type)}" placeholder="Típus" oninput="EgysegekMod.updateItem(${idx},'type',this.value)" /></td>
          <td><input value="${escapeHtml(item.serial)}" placeholder="Gyári sz." oninput="EgysegekMod.updateItem(${idx},'serial',this.value)" /></td>
          <td><input value="${escapeHtml(item.spec)}" placeholder="Szín, méret..." oninput="EgysegekMod.updateItem(${idx},'spec',this.value)" /></td>
          <td style="text-align:center;"><button class="btn btn-danger btn-sm" style="padding:2px 6px;" onclick="EgysegekMod.removeItem(${idx})">×</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateItem(idx, field, val) { activeItems[idx][field] = val; renderDocument(); }
    function addEmptyItem() { activeItems.push({ name: "", type: "", serial: "", spec: "" }); renderEditTable(); renderDocument(); }
    function removeItem(idx) { activeItems.splice(idx, 1); if (activeItems.length === 0) activeItems.push({ name: "", type: "", serial: "", spec: "" }); renderEditTable(); renderDocument(); }
    function clearItems() { activeItems = [{ name: "", type: "", serial: "", spec: "" }]; renderEditTable(); renderDocument(); }

    function formatHuYearMonthDay(isoDate) {
      if (!isoDate) return "20____ év ____ hó ____ nap";
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      return `${parts[0]}. év ${parts[1]}. hó ${parts[2]}. nap`;
    }

    function renderDocument() {
      const container = document.getElementById("ekPagesContainer");
      if (!container) return;
      container.innerHTML = "";

      const sndCode = unitValidationState.snd ? document.getElementById("ekSndCode").value.trim() : "";
      const sndName = document.getElementById("ekSndName").value.trim();
      const recCode = unitValidationState.rec ? document.getElementById("ekRecCode").value.trim() : "";
      const recName = document.getElementById("ekRecName").value.trim();
      const sndSign = document.getElementById("ekSndSign").value.trim();
      const recSign = document.getElementById("ekRecSign").value.trim();
      const dateStr = formatHuYearMonthDay(document.getElementById("ekDate").value);
      const city = document.getElementById("ekCity").value.trim() || "Debrecen";
      const note = document.getElementById("ekNote").value;

      const comp = selectedCompany || COMPANIES.DCNK;
      const displayItems = activeItems;

      const pages = [];
      let idx = 0, pageNum = 1;
      while (idx < displayItems.length) {
        const isFirst = (pageNum === 1);
        const remaining = displayItems.length - idx;
        const maxWithClosing = isFirst ? 15 : 22;
        const maxWithoutClosing = isFirst ? 26 : 34;

        if (remaining <= maxWithClosing) {
          pages.push({ pageNum, items: displayItems.slice(idx), startIndex: idx, isFirst, isLast: true });
          idx = displayItems.length;
        } else {
          const take = Math.min(remaining, maxWithoutClosing);
          pages.push({ pageNum, items: displayItems.slice(idx, idx + take), startIndex: idx, isFirst, isLast: false });
          idx += take;
          pageNum++;
          if (idx === displayItems.length) pages.push({ pageNum, items: [], startIndex: idx, isFirst: false, isLast: true });
        }
      }

      const filledCount = activeItems.filter(i => i.name.trim() || i.type.trim() || i.serial.trim()).length;
      document.getElementById("ekPageCountInfo").textContent = `(${pages.length} oldal • ${filledCount} kitöltött tétel)`;

      pages.forEach(p => {
        const pageEl = document.createElement("div");
        pageEl.className = "a4-page";

        let html = `
          <div class="doc-top-bar">
            <img src="${comp.logo}" alt="${comp.code}" onerror="this.src='${comp.fallbackLogo}'" />
            <div class="doc-top-title">EGYSÉGEK KÖZÖTTI ÁTADÓ LAP</div>
          </div>
        `;

        if (p.isFirst) {
          html += `
            <div class="doc-main-title" style="margin-bottom:5mm;">EGYSÉGEK KÖZÖTTI ÁTADÓ LAP</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 0.9fr; gap:6mm; margin-bottom:6mm;">
              <table class="party-table">
                <tr><th colspan="2">ÁTADÓ</th></tr>
                <tr><td>Egység kód</td><td>${escapeHtml(sndCode)}</td></tr>
                <tr><td>Egység neve</td><td>${escapeHtml(sndName)}</td></tr>
              </table>
              <table class="party-table">
                <tr><th colspan="2">ÁTVEVŐ</th></tr>
                <tr><td>Egység kód</td><td>${escapeHtml(recCode)}</td></tr>
                <tr><td>Egység neve</td><td>${escapeHtml(recName)}</td></tr>
              </table>
              <table class="party-table">
                <tr><th>ÁTADÁS DÁTUMA</th></tr>
                <tr><td style="text-align:center; height:14mm; vertical-align:middle; background:#fff; font-weight:600;">${escapeHtml(dateStr)}</td></tr>
              </table>
            </div>
          `;
        }

        if (p.items.length > 0 || p.isFirst) {
          html += `
            <table class="items-table">
              <thead>
                <tr>
                  <th style="width:8%;">TÉTEL SZÁM</th>
                  <th style="width:28%;">MEGNEVEZÉS</th>
                  <th style="width:18%;">TÍPUS</th>
                  <th style="width:18%;">GYÁRI SZÁM</th>
                  <th style="width:28%;">SPECIFIKÁCIÓ (PL. SZÍN, MÉRET)</th>
                </tr>
              </thead>
              <tbody>
                ${p.items.map((it, i) => `
                  <tr style="height:6.5mm;">
                    <td class="c-center">${(p.startIndex || 0) + i + 1}</td>
                    <td>${escapeHtml(it.name)}</td>
                    <td>${escapeHtml(it.type)}</td>
                    <td>${escapeHtml(it.serial)}</td>
                    <td>${escapeHtml(it.spec)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `;
        }

        if (p.isLast) {
          html += `
            <table class="note-box">
              <tr><th>MEGJEGYZÉS</th></tr>
              <tr><td>${escapeHtml(note)}</td></tr>
            </table>

            <div class="doc-legal" style="margin-bottom:5mm;">
              <div style="margin-bottom:4px;">Átvevő az átadó lap aláírásával felelősséget vállal az átvett eszközök használata közben előforduló sérülésekért, meghibásodásért, vagy az eszközök esetleges eltűnéséért.</div>
              <div>A nem rendeltetésszerű használatból adódó kár, vagy meghibásodás költsége - a garanciális javítások kivételével -, továbbá az eszköz eltűnéséből eredő kár az Átvevő egységet terheli.</div>
            </div>

            <div class="doc-date-line">Kelt.: ${escapeHtml(city)}, ${escapeHtml(dateStr)}</div>

            <div class="sign-zone">
              <div class="sign-row">
                <div class="sign-col">
                  <div style="font-weight:700; margin-bottom:7mm; font-size:10.5pt;">ÁTADÓ</div>
                  <div style="min-height:5mm; font-size:10pt;">${escapeHtml(sndSign)}</div>
                  <div class="sign-line" style="font-size:9pt; margin-bottom:10mm;">neve</div>
                  <div class="sign-line" style="font-size:9pt;">aláírása</div>
                </div>
                <div class="sign-col">
                  <div style="font-weight:700; margin-bottom:7mm; font-size:10.5pt;">ÁTVEVŐ</div>
                  <div style="min-height:5mm; font-size:10pt;">${escapeHtml(recSign)}</div>
                  <div class="sign-line" style="font-size:9pt; margin-bottom:10mm;">neve</div>
                  <div class="sign-line" style="font-size:9pt;">aláírása</div>
                </div>
              </div>
            </div>
          `;
        }

        html += `
          <div class="doc-footer">
            ${p.pageNum}. oldal — ${escapeHtml(comp.fullName)} — Egységek közötti átadó lap
          </div>
        `;

        pageEl.innerHTML = html;
        container.appendChild(pageEl);
      });
    }

    async function printAndLog() {
      if (!unitValidationState.rec || !unitValidationState.snd) {
        showToast("Hibás vagy nem engedélyezett egységkód szerepel a nyomtatványon!", "error");
        return;
      }
      window.print();
      if (!currentUser) return;
      const compTag = selectedCompany ? `[${selectedCompany.code}] ` : "";
      const snd = `${document.getElementById("ekSndCode").value} ${document.getElementById("ekSndName").value}`;
      const rec = `${document.getElementById("ekRecCode").value} ${document.getElementById("ekRecName").value}`;
      const filledCount = activeItems.filter(i => i.name.trim() || i.type.trim() || i.serial.trim()).length;
      const details = `${compTag}Átadó: ${snd} → Átvevő: ${rec} | Dátum: ${document.getElementById("ekDate").value} | ${filledCount} tétel`;

      try {
        await apiCall({
          action: "logDocument",
          username: currentUser.username,
          userName: currentUser.fullName || currentUser.name || currentUser.username,
          docType: "Egységek közötti átadás",
          details
        });
      } catch (e) {}
    }

    return {
      init, openUnitDropdown, pickUnitFromDropdown, handleUnitInput,
      updateItem, addEmptyItem, removeItem, clearItems, renderDocument, printAndLog
    };
  })();

  window.TemplateModules["egysegek_kozotti"] = window.EgysegekMod;
</script>
