<div class="gen-grid">
  <div class="left-controls no-print">
    <div style="margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" onclick="backToDocSelector()">← Vissza a nyomtatványválasztóhoz</button>
    </div>

    <div class="panel">
      <h3>1. Átvevő egység és Keltezés</h3>
      <div class="row-2">
        <div class="form-group">
          <label>Átvevő egység kódja</label>
          <div class="unit-combo">
            <input id="alRecCode" class="form-control" autocomplete="off" placeholder="Válassz vagy írj kódot..." onfocus="AtveteliLapMod.openUnitDropdown()" oninput="AtveteliLapMod.handleUnitInput()" />
            <span class="unit-combo-arrow">▼</span>
            <div id="alRecDropdown" class="unit-dropdown-menu hidden"></div>
          </div>
          <div id="alRecCodeError" class="field-error-msg hidden">Nincs hozzáférésed ehhez az egységhez!</div>
        </div>
        <div class="form-group">
          <label>Átvevő egység neve</label>
          <input id="alRecName" class="form-control" oninput="AtveteliLapMod.renderDocument()" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Keltezés helye</label>
          <input id="alCity" class="form-control" value="Debrecen" oninput="AtveteliLapMod.renderDocument()" />
        </div>
        <div class="form-group">
          <label>Átvétel dátuma</label>
          <input id="alDate" type="date" class="form-control" oninput="AtveteliLapMod.renderDocument()" />
        </div>
      </div>

      <div class="form-group">
        <label>Átvevő neve (opcionális)</label>
        <input id="alRecSign" class="form-control" placeholder="Egységvezető / átvevő neve" oninput="AtveteliLapMod.renderDocument()" />
      </div>

      <div class="form-group" style="margin-bottom:0;">
        <label>Megjegyzés</label>
        <textarea id="alNote" class="form-control" rows="2" oninput="AtveteliLapMod.renderDocument()"></textarea>
      </div>
    </div>

    <div class="panel">
      <h3>2. Átvett tárgyi eszközök (<span id="alItemCountBadge">0</span> tétel)</h3>
      <div style="max-height:360px; overflow:auto; display:flex; flex-direction:column; gap:10px;" id="alEditItemsList"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="btn btn-primary btn-sm" onclick="AtveteliLapMod.addEmptyItem()">+ Új tétel hozzáadása</button>
        <button class="btn btn-outline btn-sm" onclick="AtveteliLapMod.clearItems()">Tételek törlése</button>
      </div>
    </div>
  </div>

  <div>
    <div class="preview-toolbar no-print">
      <div>
        <strong>Élő A4 nyomtatási kép</strong>
        <span id="alPageCountInfo" style="color:var(--muted); font-size:13px; margin-left:8px;"></span>
      </div>
      <button class="btn btn-primary" onclick="AtveteliLapMod.printAndLog()">🖨️ Nyomtatás / Mentés PDF-ként</button>
    </div>
    <div class="pages-wrapper" id="alPagesContainer"></div>
  </div>
</div>

<script>
  window.AtveteliLapMod = (function () {
    let activeItems = [];
    let unitValid = true;
    let docClickBound = false;

    function emptyRow() {
      return { name: "", type: "", serial: "", spec: "", nytsz: "" };
    }

    function init() {
      unitValid = true;

      const dateEl = document.getElementById("alDate");
      if (dateEl && !dateEl.value) {
        const now = new Date();
        dateEl.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      if (!docClickBound) {
        document.addEventListener("click", e => {
          if (!e.target.closest(".unit-combo")) {
            document.getElementById("alRecDropdown")?.classList.add("hidden");
          }
        });
        docClickBound = true;
      }

      document.getElementById("alRecCode").value = "";
      handleUnitInput(false);

      if (activeItems.length === 0) activeItems = [emptyRow()];
      renderEditList();
      renderDocument();
    }

    function openUnitDropdown() {
      renderUnitDropdownList(document.getElementById("alRecCode").value);
      document.getElementById("alRecDropdown").classList.remove("hidden");
    }

    function renderUnitDropdownList(query = "") {
      const menu = document.getElementById("alRecDropdown");
      const allowed = getAllowedUnitsForCurrentUser();
      const q = (query || "").trim().toLowerCase();
      const filtered = allowed.filter(u =>
        !q || u.code.toLowerCase().includes(q) || u.name.toLowerCase().includes(q) || (u.leader || "").toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        menu.innerHTML = `<div class="unit-dropdown-empty">Nincs találat az engedélyezett egységek között.</div>`;
        return;
      }

      menu.innerHTML = filtered.map(u => `
        <div class="unit-dropdown-item" onmousedown="AtveteliLapMod.pickUnitFromDropdown('${escapeHtml(u.code)}')">
          <div><span class="u-code">${escapeHtml(u.code)}</span> – ${escapeHtml(u.name)}</div>
          ${u.leader ? `<div class="u-leader">Vezető: ${escapeHtml(u.leader)}</div>` : ""}
        </div>
      `).join("");
    }

    function pickUnitFromDropdown(code) {
      document.getElementById("alRecCode").value = code;
      document.getElementById("alRecDropdown").classList.add("hidden");
      handleUnitInput(false);
    }

    function handleUnitInput(keepMenuOpen = true) {
      const codeEl = document.getElementById("alRecCode");
      const nameEl = document.getElementById("alRecName");
      const signEl = document.getElementById("alRecSign");
      const errEl = document.getElementById("alRecCodeError");

      const typed = codeEl.value.trim();
      if (keepMenuOpen) {
        renderUnitDropdownList(typed);
        document.getElementById("alRecDropdown").classList.remove("hidden");
      }

      if (!typed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = "";
        signEl.value = "";
        unitValid = true;
        renderDocument();
        return;
      }

      const allowed = getAllowedUnitsForCurrentUser();
      const matchAllowed = allowed.find(u => u.code.toLowerCase() === typed.toLowerCase());

      if (matchAllowed) {
        codeEl.classList.remove("input-error");
        errEl.classList.add("hidden");
        nameEl.value = matchAllowed.name;
        signEl.value = matchAllowed.leader || "";
        unitValid = true;
      } else {
        codeEl.classList.add("input-error");
        errEl.classList.remove("hidden");
        nameEl.value = "";
        signEl.value = "";
        unitValid = false;
      }
      renderDocument();
    }

    function renderEditList() {
      const container = document.getElementById("alEditItemsList");
      document.getElementById("alItemCountBadge").textContent = activeItems.length;
      container.innerHTML = activeItems.map((it, idx) => `
        <div style="border:1.5px solid #e2e8f0; border-radius:8px; padding:10px; background:#f8fafc;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="font-size:12.5px; color:var(--primary-dark);">${idx + 1}. tétel</strong>
            <button class="btn btn-danger btn-sm" style="padding:2px 7px;" onclick="AtveteliLapMod.removeItem(${idx})">×</button>
          </div>
          <input class="form-control" style="padding:6px 8px; font-size:12.5px; margin-bottom:6px;" placeholder="Megnevezés" value="${escapeHtml(it.name)}" oninput="AtveteliLapMod.updateItem(${idx},'name',this.value)" />
          <div class="row-2" style="margin-bottom:6px;">
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Típus" value="${escapeHtml(it.type)}" oninput="AtveteliLapMod.updateItem(${idx},'type',this.value)" />
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Gyári szám" value="${escapeHtml(it.serial)}" oninput="AtveteliLapMod.updateItem(${idx},'serial',this.value)" />
          </div>
          <div class="row-2">
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Specifikáció (szín, méret)" value="${escapeHtml(it.spec)}" oninput="AtveteliLapMod.updateItem(${idx},'spec',this.value)" />
            <input class="form-control" style="padding:6px 8px; font-size:12.5px;" placeholder="Nyilv.tart. szám" value="${escapeHtml(it.nytsz)}" oninput="AtveteliLapMod.updateItem(${idx},'nytsz',this.value)" />
          </div>
        </div>
      `).join("");
    }

    function updateItem(idx, field, val) { activeItems[idx][field] = val; renderDocument(); }
    function addEmptyItem() { activeItems.push(emptyRow()); renderEditList(); renderDocument(); }
    function removeItem(idx) { activeItems.splice(idx, 1); if (activeItems.length === 0) activeItems.push(emptyRow()); renderEditList(); renderDocument(); }
    function clearItems() { activeItems = [emptyRow()]; renderEditList(); renderDocument(); }

    function formatHuYearMonthDay(isoDate) {
      if (!isoDate) return "20____ év ____ hó ____ nap";
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      return `${parts[0]}. év ${parts[1]}. hó ${parts[2]}. nap`;
    }

    function renderDocument() {
      const container = document.getElementById("alPagesContainer");
      if (!container) return;
      container.innerHTML = "";

      const recCode = unitValid ? document.getElementById("alRecCode").value.trim() : "";
      const recName = document.getElementById("alRecName").value.trim();
      const dateStr = formatHuYearMonthDay(document.getElementById("alDate").value);
      const city = document.getElementById("alCity").value.trim() || "Debrecen";
      const recSign = document.getElementById("alRecSign").value.trim();
      const note = document.getElementById("alNote").value;

      const comp = selectedCompany || COMPANIES.DCNK;
      const displayItems = activeItems;

      const pages = [];
      let idx = 0, pageNum = 1;
      while (idx < displayItems.length) {
        const isFirst = (pageNum === 1);
        const remaining = displayItems.length - idx;
        const maxWithClosing = isFirst ? 14 : 20;
        const maxWithoutClosing = isFirst ? 26 : 34;

        if (remaining <= maxWithClosing) {
          pages.push({ pageNum, items: displayItems.slice(idx), isFirst, isLast: true });
          idx = displayItems.length;
        } else {
          const take = Math.min(remaining, maxWithoutClosing);
          pages.push({ pageNum, items: displayItems.slice(idx, idx + take), isFirst, isLast: false });
          idx += take;
          pageNum++;
          if (idx === displayItems.length) pages.push({ pageNum, items: [], isFirst: false, isLast: true });
        }
      }

      const filledCount = activeItems.filter(i => i.name.trim() || i.type.trim() || i.nytsz.trim()).length;
      document.getElementById("alPageCountInfo").textContent = `(${pages.length} oldal • ${filledCount} kitöltött tétel)`;

      pages.forEach(p => {
        const pageEl = document.createElement("div");
        pageEl.className = "a4-page";

        let html = `
          <div class="doc-top-bar" style="margin-bottom:5mm;">
            <img src="${comp.logo}" alt="${comp.code}" onerror="this.src='${comp.fallbackLogo}'" />
            <div class="doc-top-title" style="font-size:8.5pt;">TÁRGYI ESZKÖZÖK ÁTVÉTELI LAPJA</div>
          </div>
        `;

        if (p.isFirst) {
          html += `
            <div class="doc-main-title" style="font-size:16pt; margin:0 0 6mm;">
              TÁRGYI ESZKÖZÖK ÁTVÉTELI LAPJA
            </div>
            <div style="width:45%; margin-bottom:5mm;">
              <table class="party-table" style="font-size:9pt;">
                <tr><th colspan="2">ÁTVEVŐ</th></tr>
                <tr><td>Egység kód</td><td>${escapeHtml(recCode)}</td></tr>
                <tr><td>Egység neve</td><td>${escapeHtml(recName)}</td></tr>
              </table>
            </div>
          `;
        }

        if (p.items.length > 0 || p.isFirst) {
          html += `
            <table class="items-table" style="font-size:8.5pt; margin-bottom:5mm;">
              <thead>
                <tr>
                  <th style="width:31%;">MEGNEVEZÉS</th>
                  <th style="width:14%;">TÍPUS</th>
                  <th style="width:15%;">GYÁRI SZÁM</th>
                  <th style="width:23%;">SPECIFIKÁCIÓ (PL. SZÍN, MÉRET)</th>
                  <th style="width:17%;">NYILV.TART. SZÁM</th>
                </tr>
              </thead>
              <tbody>
                ${p.items.map(it => `
                  <tr style="height:6.6mm;">
                    <td>${escapeHtml(it.name)}</td>
                    <td>${escapeHtml(it.type)}</td>
                    <td>${escapeHtml(it.serial)}</td>
                    <td>${escapeHtml(it.spec)}</td>
                    <td class="c-center">${escapeHtml(it.nytsz)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `;
        }

        if (p.isLast) {
          html += `
            <table class="note-box" style="margin-bottom:5mm;">
              <tr><th>MEGJEGYZÉS</th></tr>
              <tr><td style="height:22mm;">${escapeHtml(note)}</td></tr>
            </table>

            <div class="doc-legal" style="margin-bottom:6mm;">
              <div style="margin-bottom:4px;">Átvevő az átadó lap aláírásával felelősséget vállal az átvett eszközök használata közben előforduló sérülésekért, meghibásodásért, vagy az eszközök esetleges eltűnéséért.</div>
              <div>A nem rendeltetésszerű használatból adódó kár, vagy meghibásodás költsége - a garanciális javítások kivételével -, továbbá az eszköz eltűnéséből eredő kár az Átvevő egységet terheli.</div>
            </div>

            <table style="width:100%; border-collapse:collapse; margin-bottom:4mm;">
              <tr>
                <th style="background:var(--primary-dark); color:#fff; border:1px solid #000; padding:4px; font-family:Arial, sans-serif; font-size:9.5pt;">
                  ÁTVÉTEL ELISMERÉSE
                </th>
              </tr>
              <tr>
                <td style="border:1px solid #000; padding:4mm 5mm; font-family:Arial, sans-serif; font-size:9.5pt; line-height:1.5;">
                  <div style="margin-bottom:5mm;">
                    Alulírott Átvevő jelen átvételi elismervény aláírásával kijelentem és igazolom, hogy a fent részletezett tárgyi eszköz(öke)t a mai napon átvettem.
                  </div>
                  <div style="font-family:'Times New Roman', Times, serif; font-size:10.5pt; margin-bottom:12mm;">
                    Kelt.: ${escapeHtml(city)}, ${escapeHtml(dateStr)}
                  </div>
                  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14mm; width:74%; margin-left:auto; text-align:center; font-family:'Times New Roman', Times, serif;">
                    <div>
                      <div style="min-height:5mm; font-size:10pt;">${escapeHtml(recSign)}</div>
                      <div style="border-top:1px solid #000; padding-top:3px; font-size:10pt;">Átvevő neve</div>
                    </div>
                    <div>
                      <div style="min-height:5mm;"></div>
                      <div style="border-top:1px solid #000; padding-top:3px; font-size:10pt;">Átvevő aláírása</div>
                    </div>
                  </div>
                </td>
              </tr>
            </table>
          `;
        }

        html += `
          <div class="doc-footer">
            ${p.pageNum}. oldal — ${escapeHtml(comp.fullName)} — Tárgyi eszközök átvételi lapja
          </div>
        `;

        pageEl.innerHTML = html;
        container.appendChild(pageEl);
      });
    }

    async function printAndLog() {
      if (!unitValid) {
        showToast("Hibás vagy nem engedélyezett egységkód szerepel a nyomtatványon!", "error");
        return;
      }
      window.print();
      if (!currentUser) return;
      const compTag = selectedCompany ? `[${selectedCompany.code}] ` : "";
      const rec = `${document.getElementById("alRecCode").value} ${document.getElementById("alRecName").value}`.trim();
      const filledCount = activeItems.filter(i => i.name.trim() || i.type.trim() || i.nytsz.trim()).length;
      const details = `${compTag}Átvevő: ${rec || "—"} | Dátum: ${document.getElementById("alDate").value} | ${filledCount} tétel`;

      try {
        await apiCall({
          action: "logDocument",
          username: currentUser.username,
          userName: currentUser.fullName || currentUser.name || currentUser.username,
          docType: "Tárgyi eszközök átvételi lapja",
          details
        });
      } catch (e) {}
    }

    return {
      init, openUnitDropdown, pickUnitFromDropdown, handleUnitInput,
      updateItem, addEmptyItem, removeItem, clearItems, renderDocument, printAndLog
    };
  })();

  window.TemplateModules["atveteli_lap"] = window.AtveteliLapMod;
</script>
