<div class="gen-grid">
  <div class="left-controls no-print">
    <div style="margin-bottom:12px;">
      <button class="btn btn-outline btn-sm" onclick="backToDocSelector()">← Vissza a nyomtatványválasztóhoz</button>
    </div>

    <div class="panel">
      <h3>1. Hulladéknak minősített tételek</h3>
      <div class="form-group" style="margin-bottom:0;">
        <label>Sorszámok / Tételek felsorolása (opcionális)</label>
        <textarea id="htItems" class="form-control" rows="4" placeholder="pl. 1., 3., 5–8., 12. (ha üresen hagyod, üres vonalakkal nyomtatható)" oninput="HulladekMod.renderDocument()"></textarea>
      </div>
    </div>

    <div class="panel">
      <h3>2. A szállítás igazolása és átvétel</h3>
      <div class="row-2">
        <div class="form-group">
          <label>Elszállítás dátuma (opcionális)</label>
          <input id="htTransportDate" type="date" class="form-control" oninput="HulladekMod.renderDocument()" />
        </div>
        <div class="form-group">
          <label>Bizonylat száma (opcionális)</label>
          <input id="htReceiptNo" class="form-control" placeholder="pl. BIZ-2026/01" oninput="HulladekMod.renderDocument()" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Keltezés helye</label>
          <input id="htCity" class="form-control" value="Debrecen" oninput="HulladekMod.renderDocument()" />
        </div>
        <div class="form-group">
          <label>Átvétel / Keltezés dátuma</label>
          <input id="htDate" type="date" class="form-control" oninput="HulladekMod.renderDocument()" />
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0;">
        <label>Átvevő neve (opcionális)</label>
        <input id="htReceiver" class="form-control" placeholder="Ha üresen hagyod, aláírásvonalként jelenik meg" oninput="HulladekMod.renderDocument()" />
      </div>
    </div>
  </div>

  <div>
    <div class="preview-toolbar no-print">
      <div>
        <strong>Élő A4 nyomtatási kép</strong>
        <span style="color:var(--muted); font-size:13px; margin-left:8px;">(1 oldal)</span>
      </div>
      <button class="btn btn-primary" onclick="HulladekMod.printAndLog()">🖨️ Nyomtatás / Mentés PDF-ként</button>
    </div>
    <div class="pages-wrapper" id="htPagesContainer"></div>
  </div>
</div>

<script>
  window.HulladekMod = (function () {
    function init() {
      const dateEl = document.getElementById("htDate");
      if (dateEl && !dateEl.value) {
        const now = new Date();
        dateEl.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }
      renderDocument();
    }

    function formatHuDateBlankable(isoDate, suffix = "nap") {
      if (!isoDate) return `20____ év ____________ hó ____ ${suffix}`;
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      return `${parts[0]}. év ${parts[1]}. hó ${parts[2]}. ${suffix}`;
    }

    function renderDocument() {
      const container = document.getElementById("htPagesContainer");
      if (!container) return;

      const comp = selectedCompany || COMPANIES.DCNK;
      const itemsText = document.getElementById("htItems").value.trim();
      const transportDateStr = formatHuDateBlankable(document.getElementById("htTransportDate").value, "napon");
      const receiptNo = document.getElementById("htReceiptNo").value.trim();
      const city = document.getElementById("htCity").value.trim() || "Debrecen";
      const dateStr = formatHuDateBlankable(document.getElementById("htDate").value, "nap");
      const receiver = document.getElementById("htReceiver").value.trim();

      const receiptDisplay = receiptNo
        ? `<span style="display:inline-block; min-width:55mm; border-bottom:1px solid #000; text-align:center; font-weight:600; padding:0 4px;">${escapeHtml(receiptNo)}</span>`
        : `<span style="display:inline-block; width:65mm; border-bottom:1px solid #000;">&nbsp;</span>`;

      let itemsBlockHtml = "";
      if (itemsText) {
        itemsBlockHtml = `
          <div style="min-height:42mm; border-bottom:1px solid #000; padding:4mm 2mm; font-family:'Times New Roman', Times, serif; font-size:11.5pt; line-height:1.8; white-space:pre-wrap; margin-bottom:14mm;">
            ${escapeHtml(itemsText)}
          </div>
        `;
      } else {
        itemsBlockHtml = `
          <div style="margin:8mm 0 16mm;">
            ${Array.from({ length: 5 }, () => `<div style="border-bottom:1px solid #000; height:9.5mm;"></div>`).join("")}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="a4-page" style="font-family:'Times New Roman', Times, serif;">
          <div class="doc-top-bar" style="margin-bottom:10mm;">
            <img src="${comp.logo}" alt="${comp.code}" onerror="this.src='${comp.fallbackLogo}'" />
            <div class="doc-top-title" style="font-size:8.5pt;">HULLADÉKNAK MINŐSÍTETT TÉTELEK</div>
          </div>

          <div class="doc-main-title" style="font-size:16.5pt; margin:4mm 0 12mm;">
            HULLADÉKNAK MINŐSÍTETT TÉTELEK
          </div>

          <div style="font-size:11.5pt; line-height:1.55; text-align:justify; margin-bottom:6mm;">
            A Selejtezési Bizottság az 1. számú mellékelt jegyzékben foglaltak alapján a következő sorszámú tételeket hulladéknak minősíti, elszállításukról és bizonylatolásukról a Selejtezési Jegyzőkönyv 3. oldalán kijelölt személy gondoskodik.
          </div>

          ${itemsBlockHtml}

          <div style="font-weight:700; font-size:11.5pt; margin-bottom:5mm;">
            A szállítás igazolása:
          </div>

          <div style="font-size:11.5pt; line-height:1.6; margin-bottom:16mm;">
            A hulladék elszállítását &nbsp;${escapeHtml(transportDateStr)}&nbsp; elvégeztük:
          </div>

          <div style="width:62mm; text-align:center; margin-bottom:18mm;">
            <div style="border-top:1px solid #000; padding-top:3px; font-size:10.5pt;">aláírás</div>
          </div>

          <div style="font-size:11.5pt; line-height:1.6; margin-bottom:12mm;">
            A ${receiptDisplay} sz. bizonylatot a Selejtezési Bizottság átvette.
          </div>

          <div style="font-size:11.5pt; margin-bottom:16mm;">
            ${escapeHtml(city)}, ${escapeHtml(dateStr)}
          </div>

          <div style="display:flex; justify-content:flex-end; margin-top:4mm;">
            <div style="width:66mm; text-align:center;">
              <div style="min-height:5mm; font-size:10.5pt;">${escapeHtml(receiver)}</div>
              <div style="border-top:1px solid #000; padding-top:3px; font-size:10.5pt;">átvevő</div>
            </div>
          </div>

          <div class="doc-footer">
            1. oldal — ${escapeHtml(comp.fullName)} — Hulladéknak minősített tételek
          </div>
        </div>
      `;
    }

    async function printAndLog() {
      window.print();
      if (!currentUser) return;
      const compTag = selectedCompany ? `[${selectedCompany.code}] ` : "";
      const receiptNo = document.getElementById("htReceiptNo").value.trim();
      const details = `${compTag}Dátum: ${document.getElementById("htDate").value || "—"}${receiptNo ? " | Bizonylat: " + receiptNo : ""}`;

      try {
        await apiCall({
          action: "logDocument",
          username: currentUser.username,
          userName: currentUser.fullName || currentUser.name || currentUser.username,
          docType: "Hulladéknak minősített tételek",
          details
        });
      } catch (e) {}
    }

    return { init, renderDocument, printAndLog };
  })();

  window.TemplateModules["hulladek_tetelek"] = window.HulladekMod;
</script>
